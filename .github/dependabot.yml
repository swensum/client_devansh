version: 2
updates:
  # React admin panel — npm dependencies
  - package-ecosystem: "npm"
    directory: "/admin"          # adjust to your actual admin folder path
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Flutter storefront — pub dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Keep the GitHub Actions workflows themselves patched
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"