name: devansh
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  visibility_detector: ^0.4.0+2
  go_router: ^18.0.1
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  shared_preferences: ^2.5.5
  web: ^1.1.1
  flutter_web_plugins:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1

  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/port.jpg
    - assets/logo.png
    - assets/port2.jpg
    - assets/port3.jpg
    - assets/image1.jpg
   
    - assets/decor.jpg
    - assets/devansh.jpg
    - assets/chimney.jpg
    - assets/basket.jpg
    - assets/icons/facebook.svg
    - assets/icons/instagram.svg
    - assets/icons/whatsapp.svg
    
    - assets/icons/tiktok.svg
    - assets/png/badge.png
    - assets/png/door-handle.png
    - assets/png/money.png
    - assets/png/virtual-assistant.png
    - .env
  fonts:
    - family: BrandonGrotesque
      fonts:
        - asset: assets/font/HvDTrial_Brandon_Grotesque_black-BF64a625c944b08.otf
          weight: 900  
        - asset: assets/font/HvDTrial_Brandon_Grotesque_regular-BF64a625c9311e1.otf
          weight: 400 
  uses-material-design: true


  